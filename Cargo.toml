[package]
name = "snipping-tool"
version = "0.1.0"
edition = "2021"
description = "A small Windows-style Snipping Tool for Linux: snip, pen, highlighter, crop"

[[bin]]
name = "snipping-tool"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Make sure the Wayland client library is loaded at runtime (dlopen) so no -dev packages / pkg-config are needed.
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }

# Screen capture + save dialog through xdg-desktop-portal (works on Wayland and X11)
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }

# Imaging
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"

# Clipboard
arboard = "3"

# Misc
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"

[profile.dev.package."*"]
# Image processing is painfully slow unoptimised; optimise dependencies even in debug builds.
opt-level = 2

[profile.release]
lto = "thin"
strip = true
